name: pre-commit

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: |
          python3 -m venv .venv
          ./.venv/bin/pip install -r requirements-dev.txt
      - name: Pre-commit
        uses: Alfresco/alfresco-build-tools/.github/actions/pre-commit@768b583839a22ef7d882da0c5b82af3832197d00 # v19.7.1
        with:
          skip_checkout: "true"
